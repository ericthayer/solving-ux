[build]
  # One isolated app per client under unlisted paths; see scripts/build-clients.mjs.
  # Requires SUX_CLIENT_PATHS (and optionally SUX_FORBIDDEN_TERMS) in the Netlify site environment.
  # Redirects and headers are generated into dist/_redirects and dist/_headers.
  command = "npm run build:clients"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public, read-only build. Set VITE_ENABLE_EDITOR=true only on a team-restricted site.
  VITE_ENABLE_EDITOR = "false"
