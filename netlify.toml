[build]
  # One client-neutral site at the root; see scripts/build-public.mjs.
  # Reads SUX_FORBIDDEN_TERMS and SUX_LEGACY_PATHS from the Netlify site environment.
  # Redirects and headers are generated into dist/_redirects and dist/_headers.
  command = "npm run build:public"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public, read-only build. Set VITE_ENABLE_EDITOR=true only on a team-restricted site.
  VITE_ENABLE_EDITOR = "false"
